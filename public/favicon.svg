<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="bg" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#020617" />
            <stop offset="0.55" stop-color="#0f172a" />
            <stop offset="1" stop-color="#082f49" />
        </linearGradient>
        <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 16) rotate(45) scale(30)">
            <stop stop-color="#0891b2" stop-opacity="0.55" />
            <stop offset="1" stop-color="#0891b2" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(52 18) rotate(35) scale(26)">
            <stop stop-color="#1e3a8a" stop-opacity="0.55" />
            <stop offset="1" stop-color="#1e3a8a" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="snake" x1="16" y1="16" x2="50" y2="50" gradientUnits="userSpaceOnUse">
            <stop stop-color="#67e8f9" />
            <stop offset="1" stop-color="#38bdf8" />
        </linearGradient>
    </defs>

    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)" />
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#glow1)" />
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#glow2)" />

    <circle
        cx="32"
        cy="32"
        r="19.5"
        fill="none"
        stroke="url(#snake)"
        stroke-width="5.4"
        stroke-linecap="round"
        stroke-dasharray="112 20"
        stroke-dashoffset="10"
        opacity="0.95"
    />

    <circle cx="46.2" cy="20.2" r="4.2" fill="url(#snake)" />
    <circle cx="47.2" cy="19.4" r="0.9" fill="#020617" opacity="0.85" />
